@if (isLoading) {
<mat-spinner></mat-spinner>
} @if (discoveredVersions) { @for (version of discoveredVersions; track version)
{
<div>
  <p>
    Found <code>{{ version.api_id }} {{ version.version_id }}</code> API at
    <code>{{ version.api_base_url ?? "NO_URL_PROVIDED" }}</code
    >.
  </p>
</div>
} }

<button
  mat-raised-button
  color="primary"
  [disabled]="isLoading"
  (click)="goToAuthentication()"
>
  Next
</button>
